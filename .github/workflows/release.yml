name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ci-release.jks
          chmod 600 ci-release.jks

      - name: Build Release APK
        continue-on-error: true
        env:
          KEYSTORE_FILE: ci-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName "' app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode ' app/build.gradle | awk -F' ' '{print $2}')
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "Building release v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Delete existing release if present
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.name }}"
          echo "Checking for existing release with tag $TAG..."
          gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopLingo-Horizon-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopLingo-Horizon-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "Horizon Loop ${{ steps.version.outputs.name }}"
          body: |
            Built on ${{ steps.version.outputs.date }}
            Version code: ${{ steps.version.outputs.code }}

            What's new in v7.0.0:
            - UI REDESIGN — WaveformSeekBar replaces SeekBar in player footer
            - Loop mode cycling button in header (No Loop → Main Loop → Line Loop)
            - Tab dividers between Clean/Talk/Loop/Notes navigation
            - Enhanced Notes panel with RecyclerView, add-note form, and empty state
            - Long-press tab behavior for Loop and Notes to toggle add forms

            Previous (v6.1.0):
            - PREMIUM DARK UI REDESIGN — Emerald Mint Green accent
            - Deep Dark Navy Slate background (#080b11)
            - Super-glass card surfaces with subtle borders
            - Custom WaveformSeekBar — 30-bar visual waveform
            - Compact header: Back + Avatar + Profile + Loop + Speed
            - 4 switchable panels: Clean / Dialogue / Loop / Notes
            - Clean view: Centered EN+BN text with fade transitions
            - Dialogue view: Scrollable list with active highlighting
            - Loop panel: Saved loops shelf + add form (long-press to toggle)
            - Notes panel: Saved notes shelf + add form (long-press to toggle)
            - Tab navigation pill with accent-colored active tab
            - Floating footer card with waveform seekbar
            - 3-button transport: Rewind / Play-Pause / Forward

            Download the APK below
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f ci-release.jks
