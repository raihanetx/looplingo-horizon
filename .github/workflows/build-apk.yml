name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ci-release.jks
          chmod 600 ci-release.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        continue-on-error: true
        env:
          KEYSTORE_FILE: ci-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName "' app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode ' app/build.gradle | awk -F' ' '{print $2}')
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "Building release v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Debug-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Release-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Mapping File
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mapping-file-v${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f ci-release.jks

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName "' app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode ' app/build.gradle | awk -F' ' '{print $2}')
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Debug-v${{ steps.version.outputs.name }}
          path: ./artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Release-v${{ steps.version.outputs.name }}
          path: ./artifacts/release
        continue-on-error: true

      - name: Delete existing release if present
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.name }}"
          echo "Checking for existing release with tag $TAG..."
          gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "Horizon Loop ${{ steps.version.outputs.name }}"
          body: |
            Built on ${{ steps.version.outputs.date }}
            Version code: ${{ steps.version.outputs.code }}

            ## Download
            - **Debug APK**: Available in artifacts
            - **Release APK**: Available in artifacts (if built successfully)

            ## What's New
            - Latest build from main branch
          files: |
            ./artifacts/debug/*.apk
            ./artifacts/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
